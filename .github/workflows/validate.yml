name: Validate portal and ledger
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ledger example dependency
        run: python -m pip install -r examples/ledger/requirements.txt
      - name: Validate JavaScript and content
        run: |
          node --check app.js
          python scripts/validate.py
      - name: Exercise ledger invariants and concurrency
        run: python -m unittest discover -s examples/ledger -p 'test_*.py' -v
      - name: Verify portable export
        run: python scripts/export.py /tmp/nuarch-portable.html
